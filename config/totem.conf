# Deep sleep DISABLED. ZMK deep sleep + macOS = the keyboard can't reconnect
# after the idle timeout until a power/reset kick; a keypress alone won't wake
# it. With sleep off, a keypress wakes + reconnects even after hours (the "like
# earlier" behaviour). Trade-off: the always-on left half (broken switch) won't
# auto-sleep, so charge it over USB-C every week or so.
CONFIG_ZMK_SLEEP=n

# N-key rollover: every key in a fast burst registers (no dropped chars)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ZMK Studio is enabled per-build in build.yaml (left half only, via the
# studio-rpc-usb-uart snippet + -DCONFIG_ZMK_STUDIO=y).

# No unlock step: Studio can edit as soon as it connects over USB. With
# locking on, everything in Studio is greyed out until the hidden
# studio_unlock key is pressed — too easy to mistake for a broken keyboard.
CONFIG_ZMK_STUDIO_LOCKING=n

# Match the other keyboard's Bluetooth name.
CONFIG_ZMK_KEYBOARD_NAME="TOTEM"
