# Deep sleep after 15 min idle (saves battery)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# N-key rollover: every key in a fast burst registers (no dropped chars)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ZMK Studio is enabled per-build in build.yaml (left half only, via the
# studio-rpc-usb-uart snippet + -DCONFIG_ZMK_STUDIO=y). Studio locking is
# pulled in from boards/shields/totem/totem.conf.
